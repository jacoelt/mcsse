# Local development stack. Exists primarily because Windows Smart App Control
# blocks unsigned Python builds on the dev machine — the container supplies a
# working Python 3.13 regardless of host policy.
#
#   docker compose up                 # db + api on :8000 + front on :5173
#   docker compose run --rm api python manage.py test core.tests fetcher.tests
#
# Postgres is the default (matching production) so pg_trgm and the GIN index
# are actually exercised. To run against SQLite instead, override DATABASE_URL:
#   DATABASE_URL=sqlite:///db.sqlite3 docker compose up api

name: mcsse

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcsse
      POSTGRES_USER: mcsse
      POSTGRES_PASSWORD: mcsse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can point a local client at it; drop this if the port clashes.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcsse -d mcsse"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./back
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://mcsse:mcsse@db:5432/mcsse}
      SECRET_KEY: django-insecure-dev-only-change-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FETCH_API_KEY: dev-fetch-key
      FETCHER_LOG_LEVEL: INFO
      # Keep bytecode out of the bind-mounted host tree, and ignore any .pyc
      # left behind by a Windows interpreter.
      PYTHONPYCACHEPREFIX: /tmp/pycache
      # Set these two to have migration 0002 create a Django admin user.
      SUPER_USER_USERNAME: ${SUPER_USER_USERNAME:-}
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD:-}
    volumes:
      # Bind mount so edits on the host reload without a rebuild.
      - ./back:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  front:
    image: node:24-alpine
    working_dir: /app
    environment:
      # Read by Vite at build/serve time. The browser runs on the host, so this
      # points at the published api port rather than the compose service name.
      VITE_API_HOST: http://localhost:8000
    volumes:
      - ./front:/app
      # Named volume so the container gets Linux-native deps instead of the
      # host's Windows-built node_modules.
      - front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  pgdata:
  front_node_modules:
